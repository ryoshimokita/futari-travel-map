<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>ふたりで訪れた日本地図</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:#fffdf8;color:#1f2937;margin:0}.w{max-width:1200px;margin:auto;padding:14px}h1{font-size:clamp(24px,6vw,38px);margin:8px 0 4px}.sub,.note{color:#6b7280}.stats{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.pill{background:#fff;border:1px solid #ddd;border-radius:999px;padding:8px 12px;font-weight:700}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:8px;box-shadow:0 5px 20px #0000000d;overflow:auto;-webkit-overflow-scrolling:touch}.mapwrap{position:relative;min-width:720px}.mapwrap canvas{display:block;width:100%;height:auto}.hot{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:12px;cursor:pointer;touch-action:manipulation}.hot.on{outline:2px solid rgba(245,158,11,.45)}.islands{display:flex;gap:8px;flex-wrap:wrap}.island{padding:10px 15px;border:1px solid #ccc;border-radius:999px;background:#fff;font-weight:700}.island.on{background:#f59e0b;border-color:#f59e0b}.note{font-size:13px;line-height:1.6}.reset{margin-top:14px;padding:9px 13px;border:1px solid #ddd;border-radius:10px;background:white;color:#6b7280}@media(max-width:600px){.mapwrap{min-width:900px}}</style></head><body><main class="w"><h1>ふたりで訪れた日本地図</h1><p class="sub">行った都道府県をタップすると、その地域の内側を塗ります。もう一度タップすると解除できます。</p><div class="stats"><div class="pill"><span id="count">0</span> / 47 都道府県</div><div class="pill"><span id="pct">0</span>%</div></div><div class="card"><div class="mapwrap" id="map"><canvas id="cv" width="1456" height="1024"></canvas></div></div><h2>島の思い出</h2><div class="islands"><button class="island" data-name="直島">直島</button><button class="island" data-name="宮古島">宮古島</button></div><button class="reset" id="reset">すべての色をリセット</button><p class="note">記録はこのiPhoneのブラウザ内に保存されます。直島・宮古島は地図上の名称付近からも、上のボタンからも選択できます。</p></main><script>
const KEY='futari-travel-map-v3',W=1456,H=1024;let s={prefs:{},islands:{}};try{s=JSON.parse(localStorage.getItem(KEY))||s}catch(e){};s.prefs=s.prefs||{};s.islands=s.islands||{};
const P=[['北海道',374,231,150,115],['青森県',1288,132,58,38],['岩手県',1331,228,55,55],['秋田県',1232,216,55,50],['宮城県',1298,335,50,43],['山形県',1217,326,50,43],['福島県',1232,433,60,43],['茨城県',1253,560,50,43],['栃木県',1193,505,50,43],['群馬県',1098,523,50,43],['埼玉県',1128,581,52,34],['千葉県',1272,647,50,48],['東京都',1161,625,48,32],['神奈川県',1163,677,58,34],['新潟県',1092,430,70,44],['富山県',947,488,48,38],['石川県',867,510,44,38],['福井県',837,558,45,38],['山梨県',1052,632,48,38],['長野県',1008,556,55,55],['岐阜県',912,588,50,48],['静岡県',1028,693,60,42],['愛知県',921,670,48,38],['三重県',829,745,45,45],['滋賀県',810,643,44,42],['京都府',733,617,44,38],['大阪府',717,675,42,35],['兵庫県',645,634,50,45],['奈良県',765,735,42,38],['和歌山県',695,788,55,43],['鳥取県',557,585,55,38],['島根県',454,611,55,40],['岡山県',550,648,50,42],['広島県',461,676,55,42],['山口県',341,672,55,43],['徳島県',575,798,48,38],['香川県',558,750,48,35],['愛媛県',457,796,52,43],['高知県',506,840,58,42],['福岡県',259,720,50,40],['佐賀県',194,748,45,38],['長崎県',125,797,48,45],['熊本県',234,832,52,48],['大分県',328,783,50,43],['宮崎県',302,868,50,48],['鹿児島県',207,906,65,45],['沖縄県',1284,790,58,42]];
const map=document.getElementById('map'),cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});let base=null;const img=new Image();img.src='japan-map.png.png';img.onload=()=>{cv.width=img.naturalWidth;cv.height=img.naturalHeight;ctx.drawImage(img,0,0,cv.width,cv.height);base=ctx.getImageData(0,0,cv.width,cv.height);render()};
function addHot(n,x,y,w,h,type='pref'){let b=document.createElement('button');b.className='hot';b.dataset.name=n;b.dataset.type=type;b.setAttribute('aria-label',n);b.title=n;b.style.left=(x/W*100)+'%';b.style.top=(y/H*100)+'%';b.style.width=(w/W*100)+'%';b.style.height=(h/H*100)+'%';b.onclick=()=>toggle(n,type);map.appendChild(b)}P.forEach(a=>addHot(...a));addHot('直島',604,727,55,38,'island');addHot('宮古島',1365,865,60,40,'island');
function toggle(n,t){let o=t==='pref'?s.prefs:s.islands;o[n]=!o[n];save()}function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}
function white(d,i){return d[i]>238&&d[i+1]>238&&d[i+2]>238}function nearestWhite(data,x,y){x=Math.round(x/cv.width*W*cv.width/W);y=Math.round(y/cv.height*H*cv.height/H);for(let r=0;r<35;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.abs(dx)!==r&&Math.abs(dy)!==r)continue;let X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<cv.width&&Y<cv.height){let i=(Y*cv.width+X)*4;if(white(data,i))return[X,Y]}}return[x,y]}
function fillRegion(im,x,y){let d=im.data,[sx,sy]=nearestWhite(d,x,y),seen=new Uint8Array(cv.width*cv.height),q=[[sx,sy]],head=0;while(head<q.length){let [X,Y]=q[head++],p=Y*cv.width+X;if(seen[p])continue;seen[p]=1;let i=p*4;if(!white(d,i))continue;d[i]=250;d[i+1]=190;d[i+2]=80;d[i+3]=255;if(X>0)q.push([X-1,Y]);if(X<cv.width-1)q.push([X+1,Y]);if(Y>0)q.push([X,Y-1]);if(Y<cv.height-1)q.push([X,Y+1])}}
function render(){document.querySelectorAll('.hot').forEach(x=>x.classList.toggle('on',!!(x.dataset.type==='pref'?s.prefs[x.dataset.name]:s.islands[x.dataset.name])));document.querySelectorAll('.island').forEach(x=>x.classList.toggle('on',!!s.islands[x.dataset.name]));let n=Object.keys(s.prefs).filter(k=>s.prefs[k]).length;document.getElementById('count').textContent=n;document.getElementById('pct').textContent=Math.round(n/47*100);if(!base)return;let im=new ImageData(new Uint8ClampedArray(base.data),base.width,base.height);P.forEach(([n,x,y])=>{if(s.prefs[n])fillRegion(im,x,y)});if(s.islands['直島'])fillRegion(im,604,727);if(s.islands['宮古島'])fillRegion(im,1365,865);ctx.putImageData(im,0,0)}
document.querySelectorAll('.island').forEach(x=>x.onclick=()=>toggle(x.dataset.name,'island'));document.getElementById('reset').onclick=()=>{if(confirm('すべての色をリセットしますか？')){s={prefs:{},islands:{}};save()}};render();
</script></body></html>
