<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ふたりで訪れた日本地図</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fffdf8;color:#1f2937;margin:0}.w{max-width:1000px;margin:auto;padding:18px}h1{font-size:clamp(25px,6vw,40px);margin-bottom:5px}.sub{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:12px;box-shadow:0 5px 20px #0000000d}.stats{display:flex;gap:8px;margin:14px 0}.pill{background:#fff;border:1px solid #ddd;border-radius:999px;padding:8px 12px;font-weight:700}#map{min-height:400px;display:grid;place-items:center;overflow:auto}.prefecture{fill:#fff;stroke:#777;stroke-width:1.2;cursor:pointer}.prefecture.visited{fill:#f59e0b!important}.islands{display:flex;gap:8px;flex-wrap:wrap}.island{padding:10px 15px;border:1px solid #ccc;border-radius:999px;background:#fff;font-weight:700}.island.visited{background:#f59e0b;border-color:#f59e0b}.note{font-size:13px;color:#6b7280;line-height:1.6}</style></head><body><main class="w"><h1>ふたりで訪れた日本地図</h1><p class="sub">一緒に訪れた都道府県をタップして塗っていこう。</p><div class="stats"><div class="pill"><span id="count">0</span> / 47 都道府県</div><div class="pill"><span id="pct">0</span>%</div></div><div class="card"><div id="map">日本地図を読み込んでいます…</div></div><h2>島の思い出</h2><div class="islands"><button class="island" data-name="直島">直島</button><button class="island" data-name="宮古島">宮古島</button></div><p class="note">塗った場所はこの端末のブラウザに保存されます。同じiPhone・同じブラウザで開けば、次回も続きから使えます。</p></main><script>const KEY='futari-travel-map-v2';let s={prefs:{},islands:{}};try{s=JSON.parse(localStorage.getItem(KEY))||s}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function render(){document.querySelectorAll('.prefecture').forEach(x=>{let n=x.dataset.name||x.getAttribute('data-name')||'';x.classList.toggle('visited',!!s.prefs[n])});document.querySelectorAll('.island').forEach(x=>x.classList.toggle('visited',!!s.islands[x.dataset.name]));let n=Object.keys(s.prefs).filter(k=>s.prefs[k]).length;count.textContent=n;pct.textContent=Math.round(n/47*100)}document.querySelectorAll('.island').forEach(x=>x.onclick=()=>{let n=x.dataset.name;s.islands[n]=!s.islands[n];save()});fetch('https://raw.githubusercontent.com/lalamalink/japan-map-svg/main/svg/deformed-japan-prefecture-map.svg').then(r=>r.text()).then(t=>{map.innerHTML=t;document.querySelectorAll('.prefecture').forEach(x=>{let n=x.dataset.name||x.getAttribute('data-name')||'';x.onclick=()=>{s.prefs[n]=!s.prefs[n];save()}});render()}).catch(()=>map.innerHTML='地図を読み込めませんでした。通信環境をご確認ください。');render();</script></body></html>
