<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>ふたりで訪れた日本地図</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:#fffdf8;color:#1f2937;margin:0}.w{max-width:1200px;margin:auto;padding:14px}h1{font-size:clamp(24px,6vw,38px);margin:8px 0 4px}.sub,.note{color:#6b7280}.stats{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.pill{background:#fff;border:1px solid #ddd;border-radius:999px;padding:8px 12px;font-weight:700}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:8px;box-shadow:0 5px 20px #0000000d;overflow:auto;-webkit-overflow-scrolling:touch}.mapwrap{position:relative;min-width:720px}.mapwrap img{display:block;width:100%;height:auto}.hot{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;cursor:pointer;touch-action:manipulation}.hot.on{background:rgba(245,158,11,.43);box-shadow:0 0 0 2px rgba(217,119,6,.45) inset}.islands{display:flex;gap:8px;flex-wrap:wrap}.island{padding:10px 15px;border:1px solid #ccc;border-radius:999px;background:#fff;font-weight:700}.island.on{background:#f59e0b;border-color:#f59e0b}.note{font-size:13px;line-height:1.6}.reset{margin-top:14px;padding:9px 13px;border:1px solid #ddd;border-radius:10px;background:white;color:#6b7280}@media(max-width:600px){.mapwrap{min-width:900px}}
</style></head><body><main class="w"><h1>ふたりで訪れた日本地図</h1><p class="sub">行った都道府県の名前をタップすると色が付きます。もう一度タップすると解除できます。</p><div class="stats"><div class="pill"><span id="count">0</span> / 47 都道府県</div><div class="pill"><span id="pct">0</span>%</div></div><div class="card"><div class="mapwrap" id="map"><img src="japan-map.png.png" alt="都道府県名と島名入り日本地図"></div></div><h2>島の思い出</h2><div class="islands"><button class="island" data-name="直島">直島</button><button class="island" data-name="宮古島">宮古島</button></div><button class="reset" id="reset">すべての色をリセット</button><p class="note">記録はこのiPhoneのブラウザ内に保存されます。同じ端末・同じブラウザで開けば続きから使えます。地図は横にスクロール・拡大できます。</p></main><script>
const KEY='futari-travel-map-v3';let s={prefs:{},islands:{}};try{s=JSON.parse(localStorage.getItem(KEY))||s}catch(e){}
const P=[['北海道',374,231,150,115],['青森県',1288,132,58,38],['岩手県',1331,228,55,55],['秋田県',1232,216,55,50],['宮城県',1298,335,50,43],['山形県',1217,326,50,43],['福島県',1232,433,60,43],['茨城県',1253,560,50,43],['栃木県',1193,505,50,43],['群馬県',1098,523,50,43],['埼玉県',1128,581,52,34],['千葉県',1272,647,50,48],['東京都',1161,625,48,32],['神奈川県',1163,677,58,34],['新潟県',1092,430,70,44],['富山県',947,488,48,38],['石川県',867,510,44,38],['福井県',837,558,45,38],['山梨県',1052,632,48,38],['長野県',1008,556,55,55],['岐阜県',912,588,50,48],['静岡県',1028,693,60,42],['愛知県',921,670,48,38],['三重県',829,745,45,45],['滋賀県',810,643,44,42],['京都府',733,617,44,38],['大阪府',717,675,42,35],['兵庫県',645,634,50,45],['奈良県',765,735,42,38],['和歌山県',695,788,55,43],['鳥取県',557,585,55,38],['島根県',454,611,55,40],['岡山県',550,648,50,42],['広島県',461,676,55,42],['山口県',341,672,55,43],['徳島県',575,798,48,38],['香川県',558,750,48,35],['愛媛県',457,796,52,43],['高知県',506,840,58,42],['福岡県',259,720,50,40],['佐賀県',194,748,45,38],['長崎県',125,797,48,45],['熊本県',234,832,52,48],['大分県',328,783,50,43],['宮崎県',302,868,50,48],['鹿児島県',207,906,65,45],['沖縄県',1284,790,58,42]];
const map=document.getElementById('map');P.forEach(([n,x,y,w,h])=>{let b=document.createElement('button');b.className='hot';b.dataset.name=n;b.setAttribute('aria-label',n);b.title=n;b.style.left=(x/1456*100)+'%';b.style.top=(y/1024*100)+'%';b.style.width=(w/1456*100)+'%';b.style.height=(h/1024*100)+'%';b.onclick=()=>{s.prefs[n]=!s.prefs[n];save()};map.appendChild(b)});
function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function render(){document.querySelectorAll('.hot').forEach(x=>x.classList.toggle('on',!!s.prefs[x.dataset.name]));document.querySelectorAll('.island').forEach(x=>x.classList.toggle('on',!!s.islands[x.dataset.name]));let n=Object.keys(s.prefs).filter(k=>s.prefs[k]).length;document.getElementById('count').textContent=n;document.getElementById('pct').textContent=Math.round(n/47*100)}
document.querySelectorAll('.island').forEach(x=>x.onclick=()=>{let n=x.dataset.name;s.islands[n]=!s.islands[n];save()});document.getElementById('reset').onclick=()=>{if(confirm('すべての色をリセットしますか？')){s={prefs:{},islands:{}};save()}};render();
</script></body></html>
