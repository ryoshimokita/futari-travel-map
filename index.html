<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>ふたりで訪れた日本地図</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:#fffdf8;color:#1f2937;margin:0}.w{max-width:1100px;margin:auto;padding:14px}h1{font-size:clamp(24px,6vw,38px);margin:8px 0 4px}h2{margin-bottom:8px}.sub,.note{color:#6b7280}.stats{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.pill{background:#fff;border:1px solid #ddd;border-radius:999px;padding:8px 12px;font-weight:700}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:10px;box-shadow:0 5px 20px #0000000d;overflow:auto;-webkit-overflow-scrolling:touch}.mapwrap{min-width:650px}.mapwrap svg{display:block;width:100%;height:auto;max-height:820px}.mapwrap .prefecture{fill:#fff;stroke:#222;stroke-width:1;cursor:pointer;transition:fill .12s}.mapwrap .prefecture.visited{fill:#f59e0b!important}.mapwrap .prefecture:hover{fill:#fde7b0}.pref-label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;font-size:9px;font-weight:700;fill:#111!important;stroke:#fff!important;stroke-width:2px!important;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}.status{font-weight:700;margin:8px 2px;color:#555}.island-group{margin:18px 0}.island-group h3{font-size:16px;margin:0 0 8px}.islands{display:flex;gap:8px;flex-wrap:wrap}.island{padding:9px 13px;border:1px solid #ccc;border-radius:999px;background:#fff;font-weight:700;cursor:pointer}.island.on{background:#f59e0b;border-color:#f59e0b;color:#111}.note{font-size:13px;line-height:1.6}.reset{margin-top:14px;padding:9px 13px;border:1px solid #ddd;border-radius:10px;background:white;color:#6b7280}@media(max-width:600px){.mapwrap{min-width:720px}.pref-label{font-size:8px}}</style></head><body><main class="w"><h1>ふたりで訪れた日本地図</h1><p class="sub">行った都道府県をタップするとオレンジ色になります。地図上に都道府県名を表示しています。</p><div class="stats"><div class="pill"><span id="count">0</span> / 47 都道府県</div><div class="pill"><span id="pct">0</span>%</div><div class="pill">訪れた島 <span id="islandCount">0</span>島</div></div><div class="card"><div class="status" id="status">日本地図を読み込んでいます…</div><div class="mapwrap" id="map"></div></div><h2>島の思い出</h2><p class="sub">訪れた島をタップしてください。島の記録は47都道府県の達成率とは別に保存します。</p><div id="islandGroups"></div><button class="reset" id="reset">すべての色をリセット</button><p class="note">記録はこのiPhoneのブラウザ内に保存されます。地図形状は Geolonia の都道府県SVGを利用しています。</p></main><script src="label-positions.js?v=20260927-1152"></script><script>
const KEY='futari-travel-map-v3';let s={prefs:{},islands:{}};try{s=JSON.parse(localStorage.getItem(KEY))||s}catch(e){};s.prefs=s.prefs||{};s.islands=s.islands||{};
const names=['','北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
const shortNames=['','北海道','青森','岩手','宮城','秋田','山形','福島','茨城','栃木','群馬','埼玉','千葉','東京','神奈川','新潟','富山','石川','福井','山梨','長野','岐阜','静岡','愛知','三重','滋賀','京都','大阪','兵庫','奈良','和歌山','鳥取','島根','岡山','広島','山口','徳島','香川','愛媛','高知','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄'];
const G={'北海道・東北の島':['礼文島','利尻島','奥尻島','天売島','焼尻島','択捉島','国後島','色丹島','歯舞群島'],'日本海側の島':['佐渡島','粟島','舳倉島','隠岐諸島','西ノ島','中ノ島','知夫里島'],'瀬戸内海の島':['小豆島','直島'],'九州の島':['対馬','壱岐島','五島列島','福江島','甑島','屋久島','種子島','奄美大島','徳之島','沖永良部島','与論島','沖ノ島','硫黄島','竹島','口永良部島'],'沖縄・南西諸島':['与那国島','西表島','黒島','小浜島','竹富島','鳩間島','石垣島','多良間島','宮古島','沖縄本島','久米島','慶良間諸島','伊江島','北大東島','南大東島'],'伊豆・小笠原諸島':['伊豆諸島','大島','利島','新島','式根島','神津島','三宅島','御蔵島','八丈島','青ヶ島','小笠原諸島','父島','母島','硫黄島','南鳥島']};
const groups=document.getElementById('islandGroups');Object.entries(G).forEach(([g,arr])=>{let sec=document.createElement('section');sec.className='island-group';let h=document.createElement('h3');h.textContent=g;let box=document.createElement('div');box.className='islands';arr.forEach(n=>{let key=g+'|'+n,b=document.createElement('button');b.className='island';b.dataset.key=key;b.textContent=n;b.onclick=()=>{s.islands[key]=!s.islands[key];save()};box.appendChild(b)});sec.append(h,box);groups.appendChild(sec)});
function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}
function render(){document.querySelectorAll('#map .prefecture').forEach(el=>{let n=names[Number(el.dataset.code)];el.classList.toggle('visited',!!s.prefs[n])});document.querySelectorAll('.island').forEach(x=>x.classList.toggle('on',!!s.islands[x.dataset.key]));let n=Object.keys(s.prefs).filter(k=>s.prefs[k]).length,ic=Object.keys(s.islands).filter(k=>s.islands[k]).length;count.textContent=n;pct.textContent=Math.round(n/47*100);islandCount.textContent=ic}
function addLabels(){document.querySelectorAll('#map .prefecture').forEach(el=>{const code=Number(el.dataset.code);const old=el.querySelector(':scope > .pref-label');if(old)old.remove();let box;try{box=el.getBBox()}catch(e){return}if(!box||!box.width||!box.height)return;const pos=(window.PREF_LABEL_POSITIONS&&window.PREF_LABEL_POSITIONS[code])||[0.5,0.5];const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','pref-label');t.setAttribute('x',box.x+box.width*pos[0]);t.setAttribute('y',box.y+box.height*pos[1]);t.textContent=shortNames[code];el.appendChild(t)})}
fetch('https://raw.githubusercontent.com/geolonia/japanese-prefectures/master/map-mobile.svg').then(r=>{if(!r.ok)throw Error();return r.text()}).then(svg=>{map.innerHTML=svg;status.textContent='都道府県をタップしてください';document.querySelectorAll('#map .prefecture').forEach(el=>{let n=names[Number(el.dataset.code)];el.setAttribute('aria-label',n);el.addEventListener('click',()=>{s.prefs[n]=!s.prefs[n];save();status.textContent=n+(s.prefs[n]?'：訪問済み':'：未訪問')})});requestAnimationFrame(()=>{addLabels();render()})}).catch(()=>status.textContent='地図を読み込めませんでした。通信環境をご確認ください。');
document.getElementById('reset').onclick=()=>{if(confirm('都道府県と島の記録をすべてリセットしますか？')){s={prefs:{},islands:{}};save()}};render();
</script></body></html>
