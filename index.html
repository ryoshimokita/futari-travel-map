<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>ふたりで訪れた日本地図</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:#fffdf8;color:#1f2937;margin:0}.w{max-width:1200px;margin:auto;padding:14px}h1{font-size:clamp(24px,6vw,38px);margin:8px 0 4px}h2{margin-bottom:8px}.sub,.note{color:#6b7280}.stats{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.pill{background:#fff;border:1px solid #ddd;border-radius:999px;padding:8px 12px;font-weight:700}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:8px;box-shadow:0 5px 20px #0000000d;overflow:auto;-webkit-overflow-scrolling:touch}.mapwrap{position:relative;min-width:720px}.mapwrap canvas{display:block;width:100%;height:auto}.hot{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:12px;cursor:pointer;touch-action:manipulation}.hot.on{outline:2px solid rgba(245,158,11,.45)}.island-group{margin:18px 0}.island-group h3{font-size:16px;margin:0 0 8px}.islands{display:flex;gap:8px;flex-wrap:wrap}.island{padding:9px 13px;border:1px solid #ccc;border-radius:999px;background:#fff;font-weight:700;cursor:pointer}.island.on{background:#f59e0b;border-color:#f59e0b;color:#111}.note{font-size:13px;line-height:1.6}.reset{margin-top:14px;padding:9px 13px;border:1px solid #ddd;border-radius:10px;background:white;color:#6b7280}@media(max-width:600px){.mapwrap{min-width:900px}}</style></head><body><main class="w"><h1>ふたりで訪れた日本地図</h1><p class="sub">行った都道府県をタップすると、その地域の内側を塗ります。もう一度タップすると解除できます。</p><div class="stats"><div class="pill"><span id="count">0</span> / 47 都道府県</div><div class="pill"><span id="pct">0</span>%</div><div class="pill">訪れた島 <span id="islandCount">0</span>島</div></div><div class="card"><div class="mapwrap" id="map"><canvas id="cv" width="1536" height="1024"></canvas></div></div><h2>島の思い出</h2><p class="sub">訪れた島をタップしてください。島の記録は47都道府県の達成率とは別に保存します。</p><div id="islandGroups"></div><button class="reset" id="reset">すべての色をリセット</button><p class="note">記録はこのiPhoneのブラウザ内に保存されます。同じ端末・同じブラウザで開けば続きから使えます。</p></main><script>
const KEY='futari-travel-map-v3',W=1536,H=1024;let s={prefs:{},islands:{}};try{s=JSON.parse(localStorage.getItem(KEY))||s}catch(e){};s.prefs=s.prefs||{};s.islands=s.islands||{};
const P=[['北海道',280,180,120,80],['青森県',1170,132,60,38],['岩手県',1208,217,55,48],['秋田県',1125,218,55,48],['宮城県',1195,302,55,44],['山形県',1112,303,55,44],['福島県',1110,388,60,44],['茨城県',1160,500,52,44],['栃木県',1080,458,52,42],['群馬県',990,476,52,42],['埼玉県',1030,530,54,36],['千葉県',1168,583,52,48],['東京都',1052,568,48,34],['神奈川県',1058,617,58,36],['新潟県',958,407,70,44],['富山県',805,444,50,38],['石川県',739,470,48,38],['福井県',705,526,48,38],['山梨県',956,574,50,38],['長野県',887,510,56,52],['岐阜県',797,543,52,48],['静岡県',936,645,64,42],['愛知県',839,613,50,38],['三重県',755,678,48,44],['滋賀県',717,579,46,42],['京都府',638,552,50,42],['大阪府',620,615,46,36],['兵庫県',558,574,54,44],['奈良県',675,620,44,40],['和歌山県',641,687,58,44],['鳥取県',500,489,56,38],['島根県',413,510,58,40],['岡山県',504,548,52,42],['広島県',430,575,56,42],['山口県',330,570,58,42],['徳島県',530,700,50,38],['香川県',515,652,50,36],['愛媛県',435,700,54,42],['高知県',482,746,60,42],['福岡県',247,611,52,40],['佐賀県',184,652,46,38],['長崎県',130,700,50,46],['熊本県',239,713,54,48],['大分県',320,660,52,42],['宮崎県',301,760,52,48],['鹿児島県',214,820,66,46],['沖縄県',842,844,70,46]];
const G={'北海道・東北の島':['礼文島','利尻島','奥尻島','天売島','焼尻島','択捉島','国後島','色丹島','歯舞群島'],'日本海側の島':['佐渡島','粟島','舳倉島','隠岐諸島','西ノ島','中ノ島','知夫里島'],'瀬戸内海の島':['小豆島','直島'],'九州の島':['対馬','壱岐島','五島列島','福江島','甑島','屋久島','種子島','奄美大島','徳之島','沖永良部島','与論島','沖ノ島','硫黄島','竹島','口永良部島'],'沖縄・南西諸島':['与那国島','西表島','黒島','小浜島','竹富島','鳩間島','石垣島','多良間島','宮古島','沖縄本島','久米島','慶良間諸島','伊江島','北大東島','南大東島'],'伊豆・小笠原諸島':['伊豆諸島','大島','利島','新島','式根島','神津島','三宅島','御蔵島','八丈島','青ヶ島','小笠原諸島','父島','母島','硫黄島','南鳥島']};
const map=document.getElementById('map'),cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});let base=null;const img=new Image();img.src='japan-map-v2.png';img.onload=()=>{cv.width=img.naturalWidth;cv.height=img.naturalHeight;ctx.drawImage(img,0,0,cv.width,cv.height);base=ctx.getImageData(0,0,cv.width,cv.height);render()};
function addHot(n,x,y,w,h){let b=document.createElement('button');b.className='hot';b.dataset.name=n;b.setAttribute('aria-label',n);b.title=n;b.style.left=(x/W*100)+'%';b.style.top=(y/H*100)+'%';b.style.width=(w/W*100)+'%';b.style.height=(h/H*100)+'%';b.onclick=()=>{s.prefs[n]=!s.prefs[n];save()};map.appendChild(b)}P.forEach(a=>addHot(...a));
const groups=document.getElementById('islandGroups');Object.entries(G).forEach(([g,names])=>{let sec=document.createElement('section');sec.className='island-group';let h=document.createElement('h3');h.textContent=g;let box=document.createElement('div');box.className='islands';names.forEach(n=>{let key=g+'|'+n;let b=document.createElement('button');b.className='island';b.dataset.key=key;b.textContent=n;b.onclick=()=>{s.islands[key]=!s.islands[key];save()};box.appendChild(b)});sec.append(h,box);groups.appendChild(sec)});
function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function white(d,i){return d[i]>238&&d[i+1]>238&&d[i+2]>238}function nearestWhite(data,x,y){let sx=x/W*cv.width,sy=y/H*cv.height;for(let r=0;r<35;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.abs(dx)!==r&&Math.abs(dy)!==r)continue;let X=Math.round(sx+dx),Y=Math.round(sy+dy);if(X>=0&&Y>=0&&X<cv.width&&Y<cv.height){let i=(Y*cv.width+X)*4;if(white(data,i))return[X,Y]}}return[Math.round(sx),Math.round(sy)]}function fillRegion(im,x,y){let d=im.data,[sx,sy]=nearestWhite(d,x,y),seen=new Uint8Array(cv.width*cv.height),q=[[sx,sy]],head=0;while(head<q.length){let [X,Y]=q[head++],p=Y*cv.width+X;if(seen[p])continue;seen[p]=1;let i=p*4;if(!white(d,i))continue;d[i]=250;d[i+1]=190;d[i+2]=80;d[i+3]=255;if(X>0)q.push([X-1,Y]);if(X<cv.width-1)q.push([X+1,Y]);if(Y>0)q.push([X,Y-1]);if(Y<cv.height-1)q.push([X,Y+1])}}
function render(){document.querySelectorAll('.hot').forEach(x=>x.classList.toggle('on',!!s.prefs[x.dataset.name]));document.querySelectorAll('.island').forEach(x=>x.classList.toggle('on',!!s.islands[x.dataset.key]));let n=Object.keys(s.prefs).filter(k=>s.prefs[k]).length,ic=Object.keys(s.islands).filter(k=>s.islands[k]).length;document.getElementById('count').textContent=n;document.getElementById('pct').textContent=Math.round(n/47*100);document.getElementById('islandCount').textContent=ic;if(!base)return;let im=new ImageData(new Uint8ClampedArray(base.data),base.width,base.height);P.forEach(([n,x,y])=>{if(s.prefs[n])fillRegion(im,x,y)});ctx.putImageData(im,0,0)}document.getElementById('reset').onclick=()=>{if(confirm('都道府県と島の記録をすべてリセットしますか？')){s={prefs:{},islands:{}};save()}};render();
</script></body></html>
