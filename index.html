<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>ふたりで訪れた日本地図</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:#fffdf8;color:#1f2937;margin:0}.w{max-width:1200px;margin:auto;padding:14px}h1{font-size:clamp(24px,6vw,38px);margin:8px 0 4px}.sub,.note{color:#6b7280}.stats{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.pill{background:#fff;border:1px solid #ddd;border-radius:999px;padding:8px 12px;font-weight:700}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:8px;box-shadow:0 5px 20px #0000000d;overflow:auto;-webkit-overflow-scrolling:touch}.mapwrap{position:relative;min-width:720px}.mapwrap img{display:block;width:100%;height:auto}.islands{display:flex;gap:8px;flex-wrap:wrap}.island{padding:10px 15px;border:1px solid #ccc;border-radius:999px;background:#fff;font-weight:700}.island.visited{background:#f59e0b;border-color:#f59e0b}.note{font-size:13px;line-height:1.6}
</style>
</head><body><main class="w"><h1>ふたりで訪れた日本地図</h1><p class="sub">一緒に訪れた場所を少しずつ塗っていこう。</p><div class="stats"><div class="pill"><span id="count">0</span> / 47 都道府県</div><div class="pill"><span id="pct">0</span>%</div></div><div class="card"><div class="mapwrap"><img src="japan-map.png.png" alt="都道府県名と島名入り日本地図"></div></div><h2>島の思い出</h2><div class="islands"><button class="island" data-name="直島">直島</button><button class="island" data-name="宮古島">宮古島</button></div><p class="note">新しい詳細地図画像へ切り替えました。iPhoneでは横方向にスクロールして拡大して見ることができます。次の更新で、この画像の上に都道府県ごとのタップ領域と着色レイヤーを重ねます。島のボタンは現在も端末内に保存されます。</p></main><script>const KEY='futari-travel-map-v2';let s={prefs:{},islands:{}};try{s=JSON.parse(localStorage.getItem(KEY))||s}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function render(){document.querySelectorAll('.island').forEach(x=>x.classList.toggle('visited',!!s.islands[x.dataset.name]));let n=Object.keys(s.prefs||{}).filter(k=>s.prefs[k]).length;document.getElementById('count').textContent=n;document.getElementById('pct').textContent=Math.round(n/47*100)}document.querySelectorAll('.island').forEach(x=>x.onclick=()=>{let n=x.dataset.name;s.islands[n]=!s.islands[n];save()});render();</script></body></html>
